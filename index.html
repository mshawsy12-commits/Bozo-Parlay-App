<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bozo Parlay</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A0E27" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bozo Parlay" />

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #0A0E27; font-family: 'Archivo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .bp-loading { color: #9298C2; text-align: center; padding: 60px 20px; }

  .bp-root {
    --bg-deep: #0A0E27; --bg-panel: #12172E;
    --card: #171D3D; --card-2: #1D2447;
    --ink: #F1F0FF; --ink-dim: #9298C2;
    --purple: #7C5CFC; --blue: #3E7BFA; --cyan: #34D3C8; --pink: #EA4C89;
    --gold: #FFC93C;
    --grad: linear-gradient(135deg, var(--purple) 0%, var(--blue) 100%);
    --line: rgba(241,240,255,0.08);
    color: var(--ink); min-height: 100%; max-width: 1400px; margin: 0 auto;
    container-type: inline-size;
  }
  .bp-scoreboard { background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-deep) 100%); padding: 26px 20px 20px; position: sticky; top: 0; z-index: 5; }
  .bp-title-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .bp-title-left { display:flex; align-items:center; gap:10px; }
  .bp-logo { width:38px; height:38px; border-radius:12px; background: var(--grad); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .bp-title { font-family:'Outfit',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.2px; color:var(--ink); margin:0; }
  .bp-title span { color: var(--purple); }
  .bp-week-select { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .bp-select {
    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius:999px; padding:8px 14px;
    font-family:'Archivo',sans-serif; font-size:13px; appearance: none; -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%239298C2' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center; background-size: 14px; padding-right: 30px;
  }
  .bp-select option { background: var(--card); color: var(--ink); }
  .bp-btn { background: var(--grad); color: #fff; border:none; border-radius:999px; padding:9px 16px; font-family:'Archivo',sans-serif; font-weight:600; font-size:13px; cursor:pointer; box-shadow: 0 4px 14px rgba(124,92,252,0.35); }
  .bp-btn:hover { filter:brightness(1.06); }
  .bp-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .bp-btn.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  .bp-btn.small { padding:6px 12px; font-size:12px; }
  .bp-tabs { display:inline-flex; gap:2px; margin-top:20px; background: var(--card); border-radius: 999px; padding: 4px; }
  .bp-tab { background:transparent; border:none; color:var(--ink-dim); font-family:'Outfit',sans-serif; font-weight:600; font-size:13px; padding:9px 18px; cursor:pointer; border-radius:999px; }
  .bp-tab.active { color:#fff; background: var(--grad); }
  .bp-whoami { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-dim); margin-left: 6px; }
  .bp-admin-tag { background: rgba(255,201,60,0.18); color: var(--gold); font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:0.4px; }
  .bp-body { padding:22px 20px 32px; }
  .bp-content { max-width: 1400px; margin: 0 auto; }
  .bp-week-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom: 16px; }
  .bp-parlay-banner { background: linear-gradient(135deg, rgba(124,92,252,0.16), rgba(62,123,250,0.10)); border:1px solid rgba(124,92,252,0.35); border-radius:20px; padding:18px 20px; margin-bottom: 18px; }
  .bp-parlay-label { font-family:'Outfit',sans-serif; font-weight:600; font-size:14px; color:var(--ink); margin-bottom: 12px; }
  .bp-parlay-sub { font-weight:400; color:var(--ink-dim); font-size:12px; }
  .bp-parlay-figures { display:flex; flex-wrap:wrap; gap:24px; }
  .bp-parlay-stat { display:flex; flex-direction:column; gap:2px; }
  .bp-parlay-stat-label { font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.4px; }
  .bp-parlay-stat-value { font-family:'Outfit',sans-serif; font-weight:700; font-size:20px; color:var(--ink); display:flex; align-items:center; }
  .bp-parlay-stat.highlight .bp-parlay-stat-value { color: var(--gold); font-size:24px; }
  .bp-parlay-stat-value.profit { color: var(--cyan); font-size:16px; font-weight:600; }
  .bp-section-title { font-family:'Outfit',sans-serif; font-weight:600; font-size:15px; color:var(--ink); margin: 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .bp-week-tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .bp-bozo-label { font-size:12px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; }
  .bp-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap:14px; }
  .bp-card { background: var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow: 0 8px 24px rgba(5,7,20,0.35); position: relative; cursor: pointer; user-select: none; }
  .bp-card.readonly { cursor: default; }
  .bp-bozo-flair { position:absolute; top:-20px; right:-16px; transform: rotate(16deg); z-index: 2; }
  .bp-bozo-inline { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .bp-bozo-callout { display:flex; align-items:center; gap:10px; background: linear-gradient(135deg, rgba(255,201,60,0.16), rgba(255,138,0,0.10)); border:1px solid rgba(255,201,60,0.4); border-radius:16px; padding:10px 16px; margin-bottom:16px; }
  .bp-bozo-callout-icon { flex-shrink:0; }
  .bp-bozo-callout-text { font-size:13px; color: var(--ink); }
  .bp-bozo-callout-text b { color: var(--gold); }
  .bp-card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  .bp-name-row { display:flex; align-items:center; gap:10px; }
  .bp-avatar { width:34px; height:34px; border-radius:50%; background: var(--grad); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Outfit',sans-serif; font-weight:700; font-size:12px; flex-shrink:0; }
  .bp-name { font-family:'Outfit',sans-serif; font-weight:600; font-size:16px; }
  .badge { font-family:'Outfit',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.2px; padding:4px 11px; border-radius:999px; white-space:nowrap; }
  .st-pending { background: rgba(146,152,194,0.18); color: var(--ink-dim); }
  .st-win { background: rgba(52,211,200,0.18); color: var(--cyan); }
  .st-loss { background: rgba(234,76,137,0.18); color: var(--pink); }
  .st-push { background: rgba(146,152,194,0.14); color: var(--ink-dim); }
  .bp-desc { font-size:14px; color:var(--ink); margin:2px 0 4px; line-height:1.4; }
  .bp-meta { font-size:12px; color:var(--ink-dim); display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .bp-odds { font-family:'Outfit',sans-serif; color:var(--purple); font-weight:700; }
  .bp-final { font-size:12px; color:var(--ink-dim); margin:6px 0; }
  .bp-live { font-size:12px; color:var(--pink); margin:6px 0; display:flex; align-items:center; gap:6px; font-weight:600; }
  .bp-live-dot { width:7px; height:7px; border-radius:50%; background: var(--pink); flex-shrink:0; }
  .bp-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .bp-readonly-tag { font-size:10px; color:var(--ink-dim); border:1px solid var(--line); padding:3px 9px; border-radius:999px; }
  .bp-empty-card { background: transparent; border:1.5px dashed var(--line); border-radius:20px; padding:22px; position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:10px; justify-content:center; min-height:150px; cursor: pointer; }
  .bp-form { display:flex; flex-direction:column; gap:10px; }
  .bp-form label { font-size:11px; color:var(--ink-dim); display:block; margin-bottom:3px; }
  .bp-form input, .bp-form select, .bp-form textarea, .bp-auth input, .bp-auth select {
    width:100%; background:var(--bg-deep); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:8px 10px; font-size:13px; font-family:'Archivo',sans-serif; box-sizing:border-box;
  }
  .bp-form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .bp-form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .bp-error { color:var(--pink); font-size:12px; }
  .bp-hint { color:var(--ink-dim); font-size:11px; margin-top:4px; }
  .bp-search-row { display:flex; gap:6px; }
  .bp-search-results { display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto; }
  .bp-search-item { display:flex; justify-content:space-between; align-items:center; background:var(--bg-deep); border:1px solid var(--line); border-radius:12px; padding:8px 10px; font-size:12px; }
  .bp-search-item-teams { display:flex; gap:6px; flex-wrap:wrap; }
  .bp-search-pick { background: var(--card-2); border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:4px 10px; font-size:11px; cursor:pointer; }
  .bp-search-pick:hover { border-color: var(--purple); }
  .bp-standings-card { background: var(--card); border:1px solid var(--line); border-radius:20px; padding:18px 20px; box-shadow: 0 8px 24px rgba(5,7,20,0.35); margin-bottom: 20px; }
  .bp-chart-row { display:flex; align-items:flex-end; gap:14px; height:130px; padding-top:10px; }
  .bp-chart-col { display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; height:100%; justify-content:flex-end; }
  .bp-chart-bar { width:100%; max-width:34px; border-radius:8px 8px 4px 4px; min-height:4px; }
  .bp-chart-label { font-size:11px; color:var(--ink-dim); text-align:center; }
  .bp-chart-value { font-family:'Outfit',sans-serif; font-size:11px; font-weight:600; color:var(--ink); }
  .bp-lb-table { width:100%; border-collapse:collapse; }
  .bp-lb-table th { text-align:left; font-family:'Outfit',sans-serif; font-size:11px; color:var(--ink-dim); border-bottom:1px solid var(--line); padding:8px 10px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; }
  .bp-lb-table td { padding:11px 10px; border-bottom:1px solid var(--line); font-size:14px; }
  .bp-lb-name { font-family:'Outfit',sans-serif; font-weight:600; display:flex; align-items:center; gap:10px; }
  .bp-lb-rank { color: var(--purple); font-family:'Outfit',sans-serif; font-weight:700; width:24px; }
  .bp-history-week { font-family:'Outfit',sans-serif; font-weight:600; font-size:13px; color:var(--purple); margin: 16px 0 6px; display:flex; align-items:center; gap:6px; }
  .bp-history-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .bp-history-desc { color:var(--ink); }
  .bp-history-meta { color:var(--ink-dim); font-size:11px; }
  .bp-matrix-table { width:100%; border-collapse:collapse; font-size:12px; }
  .bp-matrix-table th { text-align:center; font-family:'Outfit',sans-serif; font-size:11px; color:var(--ink-dim); border-bottom:1px solid var(--line); padding:8px 6px; font-weight:600; }
  .bp-matrix-table th:first-child { text-align:left; }
  .bp-matrix-table td { text-align:center; padding:9px 6px; border-bottom:1px solid var(--line); position:relative; }
  .bp-matrix-table td:first-child { text-align:left; font-family:'Outfit',sans-serif; font-weight:600; color:var(--ink-dim); white-space:nowrap; }
  .bp-matrix-cell { display:inline-flex; align-items:center; gap:4px; position:relative; }
  .bp-modal-backdrop { position: fixed; inset: 0; background: rgba(5,7,20,0.72); display:flex; align-items:center; justify-content:center; padding: 20px; z-index: 50; }
  .bp-modal-panel { background: var(--card); border:1px solid var(--line); border-radius:20px; padding:22px; max-width: 480px; width:100%; max-height: 85vh; overflow-y:auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .bp-modal-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .bp-modal-title { font-family:'Outfit',sans-serif; font-weight:700; font-size:17px; display:flex; align-items:center; gap:8px; }
  .bp-modal-sub { font-size:13px; color:var(--ink-dim); margin: 10px 0 16px; line-height:1.5; }
  .bp-vote-list { display:flex; flex-direction:column; gap:8px; }
  .bp-vote-item { display:flex; align-items:center; justify-content:space-between; gap:10px; background: var(--bg-deep); border:1px solid var(--line); border-radius:14px; padding:10px 14px; cursor:pointer; text-align:left; font-family:'Archivo',sans-serif; color:var(--ink); width:100%; }
  .bp-vote-item.chosen { border-color: var(--purple); background: rgba(124,92,252,0.12); }
  .bp-vote-item-desc { font-size:11px; color:var(--ink-dim); margin-top:2px; }
  .bp-vote-count { font-family:'Outfit',sans-serif; font-weight:600; font-size:12px; color:var(--ink-dim); white-space:nowrap; flex-shrink:0; }
  .bp-vote-count.leading { color: var(--gold); }
  .bp-modal-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:18px; }
  .bp-auth { max-width: 380px; margin: 40px auto 0; display:flex; flex-direction:column; gap:8px; }
  .bp-auth label { font-size:12px; color:var(--ink-dim); margin-top: 4px; }
  @container (max-width: 560px) {
    .bp-grid { grid-template-columns: 1fr; }
    .bp-form-row, .bp-form-row-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"><div class="bp-loading">Loading…</div></div>

<script type="module" src="firebase-config.js"></script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="react" src="app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
